	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य

- Savicāra: samāpatti on subtle elements bound by space, time and cause <!-- .element: class="fragment" -->
- The subtle element appears with its present property, as one whole <!-- .element: class="fragment" -->
- Nirvicāra: on subtle elements free of such limits, with all properties <!-- .element: class="fragment" -->
</div>

<aside class="notes"><p>Ref: wisdomlib.org/hinduism/book/yoga-sutras-with-commentaries/d/doc1216643.html</p>
</aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य  

- In it the subtle element shines as it is, tinging the samādhi-wisdom <!-- .element: class="fragment" -->
- The wisdom seems empty of its own form, only the object <!-- .element: class="fragment" -->
- Gross-object ones: savitarka and nirvitarka. Subtle-object ones: savicāra and nirvicāra <!-- .element: class="fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य  

- The nirvitarka explanation covers the loss of conceptual construction <!-- .element: class="fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ॥१.४५॥

> सूक्ष्मविषयत्वं चालिङ्गपर्यवसानम्

The range of subtle objects extends up to the unmanifest (aliṅga) <!-- .element: class="fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="left drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

> सूक्ष्म-विषयत्वम्

The domain of subtle objects <!-- .element: class="left fragment" -->

> अलिङ्ग

The unmanifest, pradhāna <!-- .element: class="left fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="left drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

> पर्यवसानम्

Ending, extending up to <!-- .element: class="left fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य

- Earth's subtle form is smell-tanmātra; water's is taste; fire's is form <!-- .element: class="fragment" -->
- Air's is touch; ether's is sound <!-- .element: class="fragment" -->
- Subtler than these is the ego; subtler than the ego, the mere liṅga (mahat) <!-- .element: class="fragment" -->
</div>

<aside class="notes"><p>Ref: wisdomlib.org/hinduism/book/yoga-sutras-with-commentaries/d/doc1216644.html</p>
</aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य  

- Subtler than liṅga is the aliṅga, the unmanifest <!-- .element: class="fragment" -->
- Nothing is subtler than aliṅga <!-- .element: class="fragment" -->
- Puruṣa is subtle too, but is not the material cause of the liṅga; it is only its efficient cause <!-- .element: class="fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य  

- So subtleness reaches its limit in pradhāna <!-- .element: class="fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ॥१.४६॥

These alone are samādhi with seed <!-- .element: class="fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="left drop" -->

Only these (the four samāpattis) <!-- .element: class="left fragment" -->

> स-बीजः

With seed <!-- .element: class="left fragment" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="left drop" -->

> समाधिः

Samādhi <!-- .element: class="left fragment" -->
</div>

<aside class="notes"><p>Savitarka, nirvitarka, savicāra, nirvicāra: all have an external object as a seed.</p>
</aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## व्यासभाष्य

- Those four samāpattis have an external object as their seed <!-- .element: class="fragment" -->
- So this samādhi is sabīja <!-- .element: class="fragment" -->
- On a gross object: savitarka, nirvitarka. On a subtle object: savicāra, nirvicāra <!-- .element: class="fragment" -->
- Thus samādhi is described as four-fold <!-- .element: class="fragment" -->
</div>

<aside class="notes"><p>Ref: wisdomlib.org/hinduism/book/yoga-sutras-with-commentaries/d/doc1216645.html</p>
</aside></script></section></section><section ><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

In the purity (skill) of nirvicāra <!-- .element: class="left fragment" -->

Clarity of the inner self <!-- .element: class="left fragment" -->

Truth <!-- .element: class="left fragment" -->

Bearing, carrying <!-- .element: class="left fragment" -->

</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="left drop" -->

</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
